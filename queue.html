<!DOCTYPE html>
<html lang="en" style="background:#101014">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Now Serving — Arroyo Print Shop</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --board:#101014;        /* call-board black */
    --panel:#191920;
    --panel-2:#22222c;
    --line:rgba(255,255,255,.08);
    --line-strong:rgba(255,255,255,.16);
    --ink:#f4f4f6;
    --ink-dim:#9a9aa6;
    --ink-faint:#63636e;
    --serving:#ffc233;      /* amber — the number being called */
    --ready:#3ddc91;        /* green — claim it */
    --waiting:#7aa2f7;      /* blue — still in line */
    --alert:#ff6b6b;
  }
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--board);color:var(--ink);
    display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
  }
  .num{font-variant-numeric:tabular-nums;letter-spacing:-.03em;font-weight:700}

  /* ── top bar ─────────────────────────────────────────────────────────── */
  .bar{
    display:flex;align-items:center;justify-content:space-between;gap:1rem;
    padding:14px 22px;border-bottom:1px solid var(--line);flex:none;
  }
  .brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;letter-spacing:.02em}
  .brand i{color:var(--serving);font-size:19px}
  .brand small{color:var(--ink-faint);font-weight:400;letter-spacing:.08em;text-transform:uppercase;font-size:11px;margin-left:4px}
  .bar-right{display:flex;align-items:center;gap:9px}
  .clock{font-size:15px;color:var(--ink-dim);font-weight:600;min-width:78px;text-align:right}

  .pill{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;letter-spacing:.06em;
        text-transform:uppercase;padding:6px 11px;border-radius:99px;border:1px solid var(--line-strong);color:var(--ink-dim)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);flex:none}
  .pill.on{color:var(--ready);border-color:rgba(61,220,145,.35)}
  .pill.on .dot{background:var(--ready);animation:beat 2s ease-in-out infinite}
  .pill.warn{color:var(--serving);border-color:rgba(255,194,51,.35)}
  .pill.warn .dot{background:var(--serving)}
  .pill.off{color:var(--alert);border-color:rgba(255,107,107,.35)}
  .pill.off .dot{background:var(--alert)}
  @keyframes beat{0%,100%{opacity:1}50%{opacity:.35}}

  .ib{width:36px;height:36px;border-radius:9px;border:1px solid var(--line-strong);background:var(--panel);
      color:var(--ink-dim);cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;font-family:inherit}
  .ib:hover{background:var(--panel-2);color:var(--ink)}
  .ib.on{background:rgba(255,194,51,.14);border-color:var(--serving);color:var(--serving)}
  .ib:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--serving);outline-offset:2px}

  /* ── main split ──────────────────────────────────────────────────────── */
  .stage{flex:1;display:grid;grid-template-columns:1.45fr 1fr;gap:1px;background:var(--line);min-height:0}
  @media(max-width:860px){.stage{grid-template-columns:1fr;grid-template-rows:auto auto}}

  .left{background:var(--board);display:flex;flex-direction:column;min-height:0}
  .right{background:var(--board);display:grid;grid-template-rows:1fr 1fr;gap:1px;min-height:0}

  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}

  /* now serving — one bay per counter */
  .bays{flex:1;display:grid;gap:1px;background:var(--line);min-height:0}
  .bays.n1{grid-template-columns:1fr}
  .bays.n2{grid-template-columns:1fr 1fr}
  .bays.n3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  .bays.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  @media(max-width:860px){.bays.n2,.bays.n3,.bays.n4{grid-template-columns:1fr;grid-template-rows:none}}

  .bay{background:var(--board);display:flex;flex-direction:column;align-items:center;
       justify-content:center;text-align:center;padding:1.5rem 1rem;gap:6px;min-height:0;overflow:hidden}
  .bay-label{color:var(--serving);opacity:.85;font-size:clamp(11px,1.3vw,15px)}
  .bay-who{color:var(--ink-dim);font-weight:500}

  /* the number shrinks as counters are added, so it always fits the wall */
  .bays.n1 .bay-num{font-size:clamp(56px,13vw,168px)}
  .bays.n2 .bay-num{font-size:clamp(44px,8.5vw,112px)}
  .bays.n3 .bay-num,.bays.n4 .bay-num{font-size:clamp(34px,5.5vw,78px)}
  .bays.n1 .bay-who{font-size:clamp(14px,2vw,22px)}
  .bays.n2 .bay-who{font-size:clamp(13px,1.5vw,17px)}
  .bays.n3 .bay-who,.bays.n4 .bay-who{font-size:clamp(12px,1.2vw,14px)}

  .bay-num{line-height:.94;color:var(--serving);font-weight:700;
           font-variant-numeric:tabular-nums;letter-spacing:-.03em;
           text-shadow:0 0 60px rgba(255,194,51,.22)}
  .serving-none{color:var(--ink-faint);font-weight:600;line-height:1.3;letter-spacing:0;text-shadow:none}
  .flash{animation:flash 1.1s ease-out 3}
  @keyframes flash{0%,100%{opacity:1}50%{opacity:.25}}
  @media(prefers-reduced-motion:reduce){.flash{animation:none}.pill.on .dot{animation:none}}

  /* right-hand lists */
  .list{padding:16px 20px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .list-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex:none}
  .list-count{font-size:20px;font-weight:700;color:var(--ink)}
  .list-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:7px;min-height:0;scrollbar-width:thin}
  .list-body::-webkit-scrollbar{width:6px}
  .list-body::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}

  .row{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;background:var(--panel);border:1px solid transparent}
  .row-pos{font-size:12px;font-weight:700;color:var(--ink-faint);width:20px;text-align:center;flex:none}
  .row-ref{font-size:clamp(16px,1.7vw,21px);font-weight:700;flex:none}
  .row-meta{font-size:12px;color:var(--ink-faint);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row-tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--serving);flex:none}
  .row-tag.recall{color:var(--alert)}
  .row.recalled{border-color:rgba(255,107,107,.3)}
  .list-body.ready .row-ref{color:var(--ready)}
  .list-body.wait  .row-pos{color:var(--waiting)}
  .list.ready .list-count{color:var(--ready)}
  .list.wait  .list-count{color:var(--waiting)}
  .typical{display:none;margin-left:8px;color:var(--ink-faint);letter-spacing:.06em}
  .none{font-size:13px;color:var(--ink-faint);padding:1rem 0;text-align:center;line-height:1.6}
  .skel{height:38px;border-radius:9px;background:var(--panel);animation:sk 1.4s ease-in-out infinite;flex:none}
  @keyframes sk{0%,100%{opacity:.45}50%{opacity:.85}}

  .fault{display:none;flex:none;background:rgba(255,107,107,.1);border-top:1px solid rgba(255,107,107,.35);
         padding:13px 22px;font-size:13px;line-height:1.6;color:#ffb3b3}
  .fault b{color:#fff}
  .fault code{background:rgba(0,0,0,.35);padding:1px 5px;border-radius:4px;font-size:12px}

  /* ── fullscreen / kiosk ──────────────────────────────────────────────── */
  body.kiosk .bar{padding:16px 32px}
  body.kiosk .brand{font-size:19px}
  body.kiosk .clock{font-size:19px}
  body.kiosk .list{padding:20px 26px}
  body.kiosk.idle{cursor:none}

  /* ── sound self-test (hidden unless ?test=1 or the T key) ─────────────── */
  .test{display:none;position:fixed;right:14px;bottom:14px;width:min(340px,calc(100vw - 28px));
        background:var(--panel);border:1px solid var(--line-strong);border-radius:12px;
        padding:14px 15px;z-index:50;box-shadow:0 18px 50px rgba(0,0,0,.55)}
  .test.show{display:block}
  .test-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .test-x{background:none;border:none;color:var(--ink-faint);cursor:pointer;font:inherit;font-size:11px;
          letter-spacing:.06em;text-transform:uppercase}
  .test-x:hover{color:var(--ink)}
  .test-line{font-size:12px;color:var(--ink-dim);line-height:1.7;display:flex;gap:7px;align-items:baseline}
  .test-line b{color:var(--ink);font-weight:600}
  .test-line .ok{color:var(--ready)}
  .test-line .no{color:var(--alert)}
  .test-line .hm{color:var(--serving)}
  .test-row{display:flex;gap:6px;margin:11px 0 8px}
  .test-row input{flex:1;min-width:0;background:var(--board);border:1px solid var(--line-strong);
                  border-radius:7px;color:var(--ink);padding:7px 9px;font:inherit;font-size:13px}
  .test-btns{display:flex;flex-wrap:wrap;gap:6px}
  .test-btns button{background:var(--panel-2);border:1px solid var(--line-strong);border-radius:7px;
                    color:var(--ink);padding:7px 10px;font:inherit;font-size:12px;cursor:pointer}
  .test-btns button:hover{background:var(--line-strong)}
  .test-out{margin-top:10px;max-height:132px;overflow-y:auto;font-size:11px;line-height:1.65;
            color:var(--ink-faint);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
            white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>

<div class="bar">
  <div class="brand">
    <i class="ti ti-printer"></i> Arroyo Print Shop <small>Now serving</small>
  </div>
  <div class="bar-right">
    <div class="pill" id="pill"><span class="dot"></span><span id="pill-text">Connecting</span></div>
    <div class="clock" id="clock">--:--</div>
    <button class="ib" id="btn-sound" onclick="toggleSound()" title="Chime and call numbers out loud"><i class="ti ti-bell-off"></i></button>
    <button class="ib" onclick="load(true)" title="Refresh now (R)"><i class="ti ti-refresh"></i></button>
    <button class="ib" id="btn-full" onclick="toggleFull()" title="Fullscreen (F) — hides the address bar"><i class="ti ti-maximize"></i></button>
  </div>
</div>

<div class="stage">
  <div class="left">
    <div class="bays n1" id="bays">
      <div class="bay"><div class="bay-num serving-none">····</div></div>
    </div>
  </div>

  <div class="right">
    <div class="list ready">
      <div class="list-head">
        <span class="eyebrow" style="color:var(--ready)">Ready to claim</span>
        <span class="list-count" id="c-ready">–</span>
      </div>
      <div class="list-body ready" id="b-ready"><div class="skel"></div><div class="skel"></div></div>
    </div>
    <div class="list wait" style="border-top:1px solid var(--line)">
      <div class="list-head">
        <span class="eyebrow" style="color:var(--waiting)">Waiting in line
          <span id="typical-wait" class="typical"></span></span>
        <span class="list-count" id="c-wait">–</span>
      </div>
      <div class="list-body wait" id="b-wait"><div class="skel"></div><div class="skel"></div></div>
    </div>
  </div>
</div>

<div class="test" id="test">
  <div class="test-head">
    <span class="eyebrow">Sound self-test</span>
    <button class="test-x" onclick="toggleTest()">Close</button>
  </div>
  <div class="test-line" id="t-speech"></div>
  <div class="test-line" id="t-voice"></div>
  <div class="test-line" id="t-audio"></div>
  <div class="test-line" id="t-board"></div>
  <div class="test-row">
    <input id="t-ref" value="REQ-001042" aria-label="Reference to test">
  </div>
  <div class="test-btns">
    <button onclick="testChime()">Chime</button>
    <button onclick="testCall()">Call it out</button>
    <button onclick="testRef()">Check digits</button>
    <button onclick="testVoices()">List voices</button>
    <button onclick="testSimulate()">Simulate a call</button>
  </div>
  <div class="test-out" id="t-out">Tap a button. The first one also turns the bell on.</div>
</div>

<div class="fault" id="fault"></div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   Arroyo Print Shop — in-shop call board (display only)

   Meant for the screen on the shop wall. There is no customer input on this
   page: it shows the number being served, what's ready for pickup, and who's
   still in line. Customers read it; they don't use it.

   Reads three statuses out of the `requests` table:
     Pending      → waiting in line
     In progress  → now serving (the oldest one gets the big number)
     Done         → ready to claim

   SUPABASE SETUP (run once, SQL Editor):
     alter table requests enable row level security;
     create policy "public can read queue" on requests for select using (true);
     alter publication supabase_realtime add table requests;

   This page never writes. It pulls only ref / first name / job type / dates —
   phone, email, notes and files are never requested.
   ══════════════════════════════════════════════════════════════════════════ */

const SUPABASE_URL      = 'https://lozgxpijgtxowffvwedr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxvemd4cGlqZ3R4b3dmZnZ3ZWRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4Njg4NjQsImV4cCI6MjEwMDQ0NDg2NH0.xqBK7rM5yXfrFa8NAT6KXfms43uphGW8fxSdSAqtLTQ';

const SELECT     = 'id,ref,name,jobtype,rush,status,submitted_at,requeued_at,skipped_count,started_at,served_by';
const READY_DAYS = 7;      // drop finished jobs older than this off the board
const POLL_MS    = 15000;  // safety net behind realtime

let rows = [], calledRefs = new Set(), _booted = false;
let sound = false, live = false, fails = 0;

/* ── data ─────────────────────────────────────────────────────────────── */
async function load(){
  try{
    const url = SUPABASE_URL + '/rest/v1/requests?select=' + SELECT
              + '&status=in.(Pending,"In progress",Done)&archived=is.false&order=id.asc';
    const res = await fetch(url, {headers:{
      apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY
    }});
    if(!res.ok) throw new Error(await res.text() || ('HTTP ' + res.status));
    rows = await res.json();
    fails = 0;
    document.getElementById('fault').style.display = 'none';
    render();
    setPill(live ? 'on' : 'warn', live ? 'Live' : 'Every 15s');
  }catch(e){
    fails++;
    console.error('Queue load failed:', e);
    if(fails >= 2 || !rows.length) showFault(e);
    setPill('off','Offline');
  }
}

/* ── helpers ──────────────────────────────────────────────────────────── */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function shortName(n){
  const p = String(n || '').trim().split(/\s+/).filter(Boolean);
  if(!p.length) return 'Customer';
  return p.length > 1 ? p[0] + ' ' + p[1][0].toUpperCase() + '.' : p[0];
}
function waited(iso){
  if(!iso) return '';
  const m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if(isNaN(m) || m < 0) return '';
  if(m < 60) return m + 'm';
  const h = Math.floor(m / 60);
  return h < 24 ? h + 'h' : Math.floor(h / 24) + 'd';
}

/* ── render ───────────────────────────────────────────────────────────── */
function render(){
  const cutoff = Date.now() - READY_DAYS * 864e5;
  const prog  = rows.filter(r => r.status === 'In progress');

  // Waiting order: everyone keeps their place by order of arrival, except
  // numbers that were called and missed — those go to the back, in the order
  // they were skipped, so a no-show never jumps ahead of people still waiting.
  const wait = rows.filter(r => r.status === 'Pending').sort((a,b) => {
    const ra = a.requeued_at ? new Date(a.requeued_at).getTime() : 0;
    const rb = b.requeued_at ? new Date(b.requeued_at).getTime() : 0;
    if(ra !== rb) return ra - rb;   // never-skipped (0) first, then by skip time
    return a.id - b.id;
  });
  const ready = rows.filter(r => r.status === 'Done' &&
                  (!r.submitted_at || new Date(r.submitted_at).getTime() > cutoff)).reverse();

  // Every job in progress gets its own panel, so two staff working side by
  // side each have a number on the wall. One job = one huge number; more than
  // one and they share the space evenly.
  const bays = document.getElementById('bays');
  bays.className = 'bays n' + Math.min(prog.length || 1, 4);

  if(!prog.length){
    bays.innerHTML = `<div class="bay">
      <div class="bay-num serving-none">—</div>
      <div class="bay-who">${wait.length ? 'Next up: ' + esc(wait[0].ref || '') : 'No job on the bench right now'}</div>
    </div>`;
  } else {
    bays.innerHTML = prog.map(r => {
      const fresh = !calledRefs.has(r.ref);
      return `<div class="bay">
        <div class="eyebrow bay-label">${r.served_by ? esc(r.served_by) : 'Now serving'}</div>
        <div class="bay-num num${fresh ? ' flash' : ''}">${esc(r.ref || 'REQ-????')}</div>
        <div class="bay-who">${esc(shortName(r.name))} · ${esc(r.jobtype || 'Print job')}${
          r.rush ? ' · <span style="color:var(--serving)">Urgent</span>' : ''}</div>
      </div>`;
    }).join('');

    // Call out any number that wasn't on the board a moment ago
    prog.forEach(r => {
      if(!calledRefs.has(r.ref)){
        if(calledRefs.size || _booted) announce(r.ref, r.served_by);
        calledRefs.add(r.ref);
      }
    });
  }
  // Forget numbers that have left, so re-calling one announces again
  calledRefs.forEach(ref => { if(!prog.some(r => r.ref === ref)) calledRefs.delete(ref); });
  _booted = true;

  document.getElementById('c-ready').textContent = ready.length;
  document.getElementById('c-wait').textContent  = wait.length;

  fill('b-ready', ready, false, 'Nothing waiting for pickup.');
  fill('b-wait',  wait,  true,  'Line is clear — new orders start right away.');

  showTypicalWait();

  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('en-PH', {hour:'2-digit', minute:'2-digit'});
}

function fill(id, list, numbered, emptyMsg){
  const el = document.getElementById(id);
  if(!list.length){ el.innerHTML = `<div class="none">${emptyMsg}</div>`; return; }
  el.innerHTML = list.map((r,i) => {
    const recalled = r.requeued_at || (r.skipped_count > 0);
    const tag = recalled ? '<div class="row-tag recall">Called again</div>'
              : r.rush   ? '<div class="row-tag">Urgent</div>'
              : `<div class="row-meta" style="flex:none">${esc(waited(r.submitted_at))}</div>`;
    return `
    <div class="row${recalled ? ' recalled' : ''}">
      ${numbered ? `<div class="row-pos num">${i+1}</div>` : ''}
      <div class="row-ref num">${esc(r.ref || 'REQ-????')}</div>
      <div class="row-meta">${esc(shortName(r.name))} · ${esc(r.jobtype || 'Print job')}</div>
      ${tag}
    </div>`;
  }).join('');
}

/* ── typical wait ─────────────────────────────────────────────────────────
   Median minutes from a job arriving to it being called, over the last 25
   finished jobs. Median rather than average, so one abandoned job left open
   overnight doesn't tell everyone the wait is four hours. Stays hidden until
   there are at least three real data points.                              */
let _waitMins = null, _waitFetched = 0;

async function showTypicalWait(){
  const el = document.getElementById('typical-wait');
  if(!el) return;

  // recalc at most once every 5 minutes — it barely moves
  if(Date.now() - _waitFetched > 3e5){
    _waitFetched = Date.now();
    try{
      const res = await fetch(SUPABASE_URL + '/rest/v1/requests'
        + '?select=submitted_at,started_at&started_at=not.is.null'
        + '&submitted_at=not.is.null&order=started_at.desc&limit=25',
        {headers:{apikey:SUPABASE_ANON_KEY, Authorization:'Bearer ' + SUPABASE_ANON_KEY}});
      if(res.ok){
        const mins = (await res.json())
          .map(r => (new Date(r.started_at) - new Date(r.submitted_at)) / 60000)
          .filter(m => m > 0 && m < 60 * 24)
          .sort((a,b) => a - b);
        _waitMins = mins.length >= 3 ? Math.round(mins[Math.floor(mins.length/2)]) : null;
      }
    }catch(e){ /* leave the previous figure in place */ }
  }

  if(_waitMins == null){ el.style.display = 'none'; return; }
  el.style.display = 'inline';
  el.textContent = '· typically ' + (_waitMins < 60
    ? _waitMins + ' min'
    : Math.round(_waitMins/60) + ' hr');
}

/* ── sound: chime, then call the number out loud ──────────────────────────
   Three things browsers insist on, all handled here:
     1. Audio and speech stay blocked until the user taps something — the bell
        button is that tap, so both engines are primed inside toggleSound().
     2. getVoices() is empty on first call; voices arrive on voiceschanged.
     3. An utterance held only in a local variable can be garbage-collected
        mid-sentence (Chrome/Safari), so the last one is kept in _lastUtterance.
                                                                            */
let _ac = null, _voice = null, _lastUtterance = null;

function audio(){
  if(!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
  if(_ac.state === 'suspended') _ac.resume();
  return _ac;   // one context reused — browsers cap you at about six
}

/* English only. u.lang is a hint that Android TTS ignores, so hand it a real
   voice object and avoid en-PH, which reads staff names with a Taglish accent. */
function pickVoice(){
  if(_voice) return _voice;
  if(!('speechSynthesis' in window)) return null;
  const vs = speechSynthesis.getVoices();
  if(!vs.length) return null;                       // not loaded yet, retry later
  const en = vs.filter(v => /^en(-|_|$)/i.test(v.lang));
  if(!en.length) return null;                       // device has no English voice
  _voice = en.find(v => /^en[-_](US|GB)/i.test(v.lang) && !/eloquence|novelty/i.test(v.name))
        || en.find(v => /^en[-_](US|GB)/i.test(v.lang))
        || en[0];
  return _voice;
}

if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = () => { _voice = null; pickVoice(); };
  pickVoice();
}

function chime(){
  if(!sound) return;
  try{
    const ac = audio();
    [660, 990, 1320].forEach((f,i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = f;
      o.connect(g); g.connect(ac.destination);
      const t = ac.currentTime + i * 0.16;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
      o.start(t); o.stop(t + 0.36);
    });
  }catch(e){}
}

function speak(line){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.resume();                       // Chrome can sit paused
    const u = new SpeechSynthesisUtterance(line);
    const v = pickVoice();
    if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'en-US'; }
    u.rate = 0.85; u.volume = 1;
    _lastUtterance = u;
    speechSynthesis.speak(u);
  }catch(e){ console.warn('speak failed:', e); }
}

/* Last number in the ref, leading zeros dropped, spoken digit by digit — so
   no prefix and no "dash" is ever read out. REQ-001042 → "1 0 4 2"          */
function speakableRef(ref){
  const groups = String(ref || '').match(/\d+/g);
  if(!groups) return '';
  const n = groups[groups.length - 1].replace(/^0+/, '') || '0';
  return n.split('').join(' ');
}

function announce(ref, by){
  if(!sound) return;
  chime();
  const digits = speakableRef(ref);
  if(!digits) return;
  const line = 'Number ' + digits + (by ? ', counter ' + by : '')
             + '. Number ' + digits + '.';          // twice — shops are loud
  // speechSynthesis queues on its own, so two counters calling at once are
  // read one after the other rather than on top of each other
  setTimeout(() => speak(line), 700);
}

function toggleSound(){
  sound = !sound;
  const b = document.getElementById('btn-sound');
  b.classList.toggle('on', sound);
  b.innerHTML = `<i class="ti ti-bell${sound?'':'-off'}"></i>`;
  if(sound){
    audio();                 // unlock the AudioContext inside the tap
    speak('Sound on');       // unlock speech inside the tap — iOS needs this
    chime();
  } else {
    try{ speechSynthesis.cancel(); }catch(e){}
  }
}

/* ── fullscreen / kiosk ───────────────────────────────────────────────── */
let wakeLock = null, idleTimer = null;

async function toggleFull(){
  try{
    if(!document.fullscreenElement){
      await document.documentElement.requestFullscreen({navigationUI:'hide'});
    } else {
      await document.exitFullscreen();
    }
  }catch(e){
    // Fullscreen refused (some in-app browsers) — still switch to the board layout.
    document.body.classList.toggle('kiosk');
    syncFullBtn();
  }
}

function syncFullBtn(){
  const on = !!document.fullscreenElement || document.body.classList.contains('kiosk');
  const b = document.getElementById('btn-full');
  b.classList.toggle('on', on);
  b.innerHTML = `<i class="ti ti-${on ? 'minimize' : 'maximize'}"></i>`;
}

document.addEventListener('fullscreenchange', async () => {
  const on = !!document.fullscreenElement;
  document.body.classList.toggle('kiosk', on);
  syncFullBtn();
  // keep the shop display awake while it's up on the wall
  try{
    if(on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    else if(wakeLock){ wakeLock.release(); wakeLock = null; }
  }catch(e){}
});

// hide the mouse pointer on the wall display after a few idle seconds
function nudge(){
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 4000);
}
['mousemove','touchstart','keydown'].forEach(ev => document.addEventListener(ev, nudge, {passive:true}));

document.addEventListener('keydown', e => {
  if(e.target && e.target.tagName === 'INPUT') return;
  if(e.key === 'f' || e.key === 'F') toggleFull();
  if(e.key === 'r' || e.key === 'R') load();
  if(e.key === 't' || e.key === 'T') toggleTest();
});

/* ── status + errors ──────────────────────────────────────────────────── */
function setPill(state, text){
  document.getElementById('pill').className = 'pill ' + state;
  document.getElementById('pill-text').textContent = text;
}

function showFault(e){
  const msg = String(e && e.message || '');
  const el = document.getElementById('fault');
  if(/permission|policy|row-level|RLS|42501/i.test(msg)){
    el.innerHTML = '<b>The queue is locked to the public.</b> In the Supabase SQL editor run: '
      + '<code>create policy "public can read queue" on requests for select using (true);</code>';
  } else if(/Failed to fetch|NetworkError|Load failed/i.test(msg)){
    el.innerHTML = '<b>Can\'t reach the queue.</b> Check the internet, and open this page over '
      + '<code>https://</code> rather than straight from a file — browsers block requests from <code>file://</code> pages.';
  } else {
    el.innerHTML = '<b>Queue didn\'t load.</b> ' + esc(msg);
  }
  el.style.display = 'block';
}

/* ── realtime ─────────────────────────────────────────────────────────── */
function startRealtime(){
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
  s.onload = () => {
    try{
      const c = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY,
        {realtime:{params:{eventsPerSecond:5}}});
      c.channel('arroyo-callboard')
        .on('postgres_changes', {event:'*', schema:'public', table:'requests'}, () => load())
        .subscribe(st => {
          if(st === 'SUBSCRIBED'){ live = true; setPill('on','Live'); }
          else if(['CHANNEL_ERROR','TIMED_OUT','CLOSED'].indexOf(st) > -1){ live = false; setPill('warn','Every 15s'); }
        });
    }catch(e){ console.warn('Realtime unavailable, polling instead:', e); }
  };
  s.onerror = () => setPill('warn','Every 15s');
  document.head.appendChild(s);
}

/* ── sound self-test ──────────────────────────────────────────────────────
   Open with ?test=1 or the T key. Staff-facing, hidden from customers.
   Answers the three questions that actually matter when the board goes quiet:
   does this device have speech at all, which voice will it use, and does a
   status change reach the announcer.                                       */
function toggleTest(){
  const el = document.getElementById('test');
  el.classList.toggle('show');
  if(el.classList.contains('show')){ diag(); _diagTimer = setInterval(diag, 1000); }
  else { clearInterval(_diagTimer); }
}
let _diagTimer = null;

function tlog(msg){
  const el = document.getElementById('t-out');
  const t = new Date().toLocaleTimeString('en-PH', {hour12:false});
  el.textContent = t + '  ' + msg + '\n' + el.textContent;
}

function diag(){
  const has = 'speechSynthesis' in window;
  const vs  = has ? speechSynthesis.getVoices() : [];
  const en  = vs.filter(v => /^en(-|_|$)/i.test(v.lang));
  const v   = pickVoice();

  set('t-speech', 'Speech engine', has
    ? (vs.length ? cls('ok', 'available, ' + vs.length + ' voices')
                 : cls('hm', 'present, voices still loading'))
    : cls('no', 'not supported on this browser'));

  set('t-voice', 'Voice in use', v
    ? cls(/^en[-_](US|GB)/i.test(v.lang) ? 'ok' : 'hm', v.name + ' · ' + v.lang)
    : (en.length ? cls('hm', 'English found, not picked yet')
                 : cls('no', 'no English voice installed')));

  set('t-audio', 'Chime', _ac
    ? cls(_ac.state === 'running' ? 'ok' : 'hm', 'context ' + _ac.state)
    : cls('hm', 'not started — tap the bell'));

  const prog = rows.filter(r => r.status === 'In progress').length;
  set('t-board', 'Board', cls(sound ? 'ok' : 'hm', (sound ? 'bell on' : 'bell OFF — silent'))
    + ' · ' + rows.length + ' rows, ' + prog + ' in progress · ' + (live ? 'live' : 'polling'));
}
function cls(k, txt){ return '<span class="' + k + '">' + esc(txt) + '</span>'; }
function set(id, label, html){
  const el = document.getElementById(id);
  if(el) el.innerHTML = '<b>' + label + '</b>' + html;
}

function ensureSound(){ if(!sound) toggleSound(); }   // this click is the gesture

function testChime(){
  ensureSound();
  chime();
  tlog('Chime played. Nothing audible means system volume, or the tab is muted.');
}

function testCall(){
  ensureSound();
  const ref = document.getElementById('t-ref').value.trim() || 'REQ-001042';
  announce(ref, 'Counter 1');
  tlog('Calling ' + ref + ' → "Number ' + speakableRef(ref) + ', counter Counter 1."');
}

function testRef(){
  const custom = document.getElementById('t-ref').value.trim();
  const refs = [custom || 'REQ-001042', 'REQ-000007', 'ARR-2026-0042', '1042'];
  tlog('Spoken digits (no prefix, no dash):\n' + refs
    .map(r => '  ' + r + '  →  "' + (speakableRef(r) || '(nothing)') + '"').join('\n'));
}

function testVoices(){
  if(!('speechSynthesis' in window)){ tlog('No speech engine on this browser.'); return; }
  const vs = speechSynthesis.getVoices();
  if(!vs.length){ tlog('No voices yet. Wait a second and tap again.'); return; }
  tlog(vs.length + ' voices:\n' + vs
    .map(v => '  ' + v.lang + '  ' + v.name + (v.default ? '  (device default)' : '')).join('\n'));
}

/* Injects a fake In-progress row so the whole path gets exercised: bay layout,
   flash, calledRefs bookkeeping, chime, voice. Clears itself after 10s.     */
function testSimulate(){
  ensureSound();
  if(rows.some(r => r.id === -1)){ tlog('Test row is already on the board.'); return; }
  rows = rows.concat([{
    id:-1, ref:'REQ-009999', name:'Test Customer', jobtype:'Self-test',
    rush:false, status:'In progress', submitted_at:new Date().toISOString(),
    served_by:'Test counter'
  }]);
  render();
  tlog('REQ-009999 pushed to In progress. Board and voice should react now.');
  setTimeout(() => {
    rows = rows.filter(r => r.id !== -1);
    render();
    tlog('Test row removed.');
  }, 10000);
}

/* ── boot ─────────────────────────────────────────────────────────────── */
(function init(){
  // ?board=1 opens straight into the wall layout
  const q = new URLSearchParams(location.search);
  if(q.get('board') === '1'){
    document.body.classList.add('kiosk'); syncFullBtn();
  }
  if(q.get('test') === '1') toggleTest();

  load();
  startRealtime();
  setInterval(load, POLL_MS);
  setInterval(() => { if(rows.length) render(); }, 30000);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) load(); });
  nudge();
})();
</script>
