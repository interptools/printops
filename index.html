<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Arroyo Suite – Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #e8e8e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 36px 32px 32px;
      width: 340px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo */
    .logo-wrap {
      width: 72px;
      height: 72px;
      border-radius: 14px;
      border: 1.5px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      background: #fff;
    }
    .logo-inner {
      text-align: center;
      line-height: 1.1;
    }
    .logo-letter {
      font-size: 22px;
      font-weight: 700;
      color: #222;
      letter-spacing: -1px;
    }
    .logo-name {
      font-size: 7px;
      font-weight: 600;
      color: #444;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .logo-tagline {
      font-size: 5.5px;
      color: #aaa;
      letter-spacing: 0.5px;
    }

    h1 {
      font-size: 17px;
      font-weight: 700;
      color: #111;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 20px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      width: 100%;
      background: #f1f1f1;
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 22px;
      gap: 3px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 0;
      border: none;
      border-radius: 8px;
      background: transparent;
      font-size: 13px;
      font-weight: 600;
      color: #888;
      cursor: pointer;
      transition: background 0.18s, color 0.18s, box-shadow 0.18s;
    }
    .tab-btn.active {
      background: #fff;
      color: #111;
      box-shadow: 0 1px 6px rgba(0,0,0,0.10);
    }

    /* Form panels */
    .panel { display: none; width: 100%; flex-direction: column; gap: 12px; }
    .panel.active { display: flex; }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: #555;
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      color: #222;
      background: #fafafa;
      outline: none;
      transition: border-color 0.18s;
    }
    input[type="text"]::placeholder,
    input[type="password"]::placeholder { color: #bbb; }
    input[type="text"]:focus,
    input[type="password"]:focus { border-color: #1a73e8; background: #fff; }

    .field-group { display: flex; flex-direction: column; }

    .btn-signin {
      width: 100%;
      padding: 13px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.18s;
    }
    .btn-signin:hover { background: #1557b0; }

    .error-msg {
      font-size: 12px;
      color: #e53935;
      text-align: center;
      min-height: 16px;
    }

    /* Role badge shown after login */
    .role-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .role-badge.owner { background: #fff3e0; color: #e65100; }
    .role-badge.employee { background: #e8f5e9; color: #1b5e20; }

    /* Dashboard overlay (shown after login) */
    .dashboard {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }
    .dashboard.active { display: flex; }
    .dash-title {
      font-size: 16px;
      font-weight: 700;
      color: #111;
    }
    .dash-sub {
      font-size: 13px;
      color: #666;
      max-width: 260px;
    }
    .btn-logout {
      margin-top: 8px;
      padding: 8px 22px;
      background: #f1f1f1;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-logout:hover { background: #e0e0e0; }

    .divider {
      width: 100%;
      height: 1px;
      background: #eee;
      margin: 4px 0;
    }
  </style>
</head>
<body>

<div class="card">

  <!-- Logo -->
  <div class="logo-wrap">
    <div class="logo-inner">
      <div class="logo-letter">A</div>
      <div class="logo-name">Arroyo</div>
      <div class="logo-tagline">simple · modern · pro</div>
    </div>
  </div>

  <!-- Login view -->
  <div id="loginView" style="width:100%;display:flex;flex-direction:column;align-items:center;">
    <h1>Arroyo Suite</h1>
    <p class="subtitle" id="subtitleText">Owner access only</p>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('owner')">🔑 Owner</button>
      <button class="tab-btn" onclick="switchTab('employee')">👤 Employee</button>
    </div>

    <!-- Owner panel -->
    <div class="panel active" id="panel-owner">
      <div class="field-group">
        <div class="field-label">Password</div>
        <input type="password" id="ownerPass" placeholder="Enter owner password" />
      </div>
      <div class="error-msg" id="ownerError"></div>
      <button class="btn-signin" onclick="signIn('owner')">Sign in as Owner</button>
    </div>

    <!-- Employee panel -->
    <div class="panel" id="panel-employee">
      <div class="field-group">
        <div class="field-label">Employee ID / Username</div>
        <input type="text" id="empUser" placeholder="Enter your username" />
      </div>
      <div class="field-group">
        <div class="field-label">Password</div>
        <input type="password" id="empPass" placeholder="Enter your password" />
      </div>
      <div class="error-msg" id="empError"></div>
      <button class="btn-signin" onclick="signIn('employee')">Sign in as Employee</button>
    </div>
  </div>

  <!-- Dashboard view (shown after successful login) -->
  <div class="dashboard" id="dashboardView">
    <span class="role-badge" id="roleBadge">owner</span>
    <div class="dash-title" id="dashTitle">Welcome back!</div>
    <p class="dash-sub" id="dashSub">You are signed in to Arroyo Suite.</p>
    <div class="divider"></div>
    <button class="btn-logout" onclick="signOut()">Sign out</button>
  </div>

</div>

<script>
  // ── Credentials ──────────────────────────────────────────────
  const OWNER_PASSWORD = 'owner123';

  // Add employees manually below in this format:
  // { username: 'name', password: 'pass' },
  const EMPLOYEES = [

  ];
  // ─────────────────────────────────────────────────────────────

  let currentTab = 'owner';

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', (i === 0 && tab === 'owner') || (i === 1 && tab === 'employee'));
    });
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + tab).classList.add('active');

    document.getElementById('subtitleText').textContent =
      tab === 'owner' ? 'Owner access only' : 'Employee access';

    // Clear errors
    document.getElementById('ownerError').textContent = '';
    document.getElementById('empError').textContent = '';
  }

  function signIn(role) {
    if (role === 'owner') {
      const pass = document.getElementById('ownerPass').value;
      if (pass === OWNER_PASSWORD) {
        showDashboard('owner', 'Owner Dashboard', 'Full access to all Arroyo Suite features.');
      } else {
        document.getElementById('ownerError').textContent = 'Incorrect password. Please try again.';
      }

    } else {
      const user = document.getElementById('empUser').value.trim().toLowerCase();
      const pass = document.getElementById('empPass').value;
      const match = EMPLOYEES.find(e => e.username === user && e.password === pass);
      if (match) {
        showDashboard('employee', `Welcome, ${capitalize(match.username)}!`, 'You have employee access. Some features may be restricted.');
      } else {
        document.getElementById('empError').textContent = 'Invalid username or password.';
      }
    }
  }

  function showDashboard(role, title, sub) {
    document.getElementById('loginView').style.display = 'none';
    const dash = document.getElementById('dashboardView');
    dash.classList.add('active');

    const badge = document.getElementById('roleBadge');
    badge.textContent = role === 'owner' ? '👑 Owner' : '👤 Employee';
    badge.className = 'role-badge ' + role;

    document.getElementById('dashTitle').textContent = title;
    document.getElementById('dashSub').textContent = sub;
  }

  function signOut() {
    document.getElementById('loginView').style.display = 'flex';
    document.getElementById('dashboardView').classList.remove('active');
    document.getElementById('ownerPass').value = '';
    document.getElementById('empUser').value = '';
    document.getElementById('empPass').value = '';
    switchTab('owner');
  }

  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  // Allow Enter key to submit
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') signIn(currentTab);
  });
</script>

</body>
</html>
